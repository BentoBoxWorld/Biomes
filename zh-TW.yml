biomes:
  commands:
    # This section contains only admin commands translations.
    admin:
      main:
        description: 生態域管理主指令
      import:
        parameters: <檔案>
        description: 匯入生態域資料
        confirmation: 這將移除 [gamemode] 的所有生態域，並從範本檔案匯入新的生態域，請確認是否繼續。
      migrate:
        description: 將生態域資料遷移至新的資料格式
      set:
        description: 變更玩家島嶼的生態域
        parameters: <玩家> <生態域 ID> [模式] [大小]
      unlock:
        description: 無需檢查解鎖條件即可為玩家解鎖生態域；若最後加上 true，則會同時標記為已購買。
        parameters: <玩家> <生態域 ID> [true]
      clear-queue:
        description: 清除生態域更新等待佇列
    # This section contains only player commands translations.
    player:
      main:
        description: 開啟生態域選擇介面
      set:
        description: 變更島嶼生態域
        parameters: <生態域 ID> [模式] [大小]
      buy:
        description: 購買指定生態域
        parameters: <生態域 ID>
      info:
        description: 在聊天室顯示生態域詳細資訊
        parameters: <生態域 ID>
  gui:
    titles:
      player-panel: <black><bold> 選擇生態域
      buy-panel: <black><bold> 購買生態域
      advanced-panel: <black><bold> 生態域更新模式
      # All Titles Below this comment is for Admin Menus.
      admin-panel: <black><bold> 管理介面
      settings: <black><bold> 設定
      library: <black><bold> 資料庫
      manage-biomes: <black><bold> 管理生態域
      manage-bundles: <black><bold> 管理套件
      manage-islands: <black><bold> 管理島嶼資料
      edit-biome: '<black><bold> 編輯生態域：[biome]'
      edit-bundle: '<black><bold> 編輯套件：[bundle]'
      edit-island: '<black><bold> 編輯島嶼：[island]'
      environment-selector: <black><bold> 選擇維度
      biome-selector: <black><bold> 選擇生態域
      bundle-selector: <black><bold> 選擇套件
      item-selector: <black><bold> 選擇物品
    buttons:
      island:
        name: <white><bold> 島嶼
        description: |-
          <gray> 將整座島嶼
          <gray> 變更為指定的
          <gray> 生態域。
      chunk:
        name: <white><bold> 區塊
        description: <gray> 以區塊為單位變更生態域。
      range:
        name: <white><bold> 範圍
        description: <gray> 依指定範圍變更生態域。
      reduce:
        name: <white><bold> 減少
        description: <gray> 減少 <yellow>[number]
      increase:
        name: <white><bold> 增加
        description: <gray> 增加 <yellow>[number]
      accept:
        name: <white><bold> 套用變更
        description: |-
          <gray> 將生態域變更為
          <yellow>[biome]
          <gray> 更新模式：<yellow>[mode]
          <gray> 更新範圍：<yellow>[number]
      return:
        name: <white><bold> 返回
        description: <gray> 返回上一個選單。
      previous:
        name: <white><bold> 上一頁
        description: <gray> 前往第 <yellow>[number] <gray> 頁
      next:
        name: <white><bold> 下一頁
        description: <gray> 前往第 <yellow>[number] <gray> 頁
      quit:
        name: <white><bold> 離開
        description: <gray> 關閉此介面。
      save:
        name: <white><bold> 儲存
        description: <gray> 儲存變更並返回。
      cancel:
        name: <white><bold> 取消
        description: <gray> 取消變更並返回。
      search:
        name: <white><bold> 搜尋
        description: |-
          <gray> 輸入文字以搜尋
          <gray> 指定的項目。
        search: '<aqua>搜尋內容：[value]'
      buy:
        name: <white><bold> 購買
        description: <gray> 購買新的生態域。
      manage_islands:
        name: <white><bold> 管理島嶼
        description: |-
          <gray> 管理島嶼
          <gray> 資料。
      manage_biomes:
        name: <white><bold> 管理生態域
        description: |-
          <gray> 管理生態域
          <gray> 資料。
      manage_bundles:
        name: <white><bold> 管理套件
        description: |-
          <gray> 管理套件
          <gray> 資料。
      settings:
        name: <white><bold> 設定
        description: |-
          <gray> 調整 Biomes
          <gray> 附加元件設定。
      import_template:
        name: <white><bold> 匯入範本
        description: |-
          <gray> 從附加元件
          <gray> 資料夾匯入
          <gray> 範本檔案。
      web_library:
        name: <white><bold> 線上資料庫
        description: |-
          <gray> 存取包含
          <gray> 共用生態域的
          <gray> 線上資料庫。
      export_from_database:
        name: <white><bold> 匯出資料庫
        description: |-
          <gray> 將資料庫匯出成
          <gray> 檔案，並儲存至
          <gray> 附加元件資料夾。
      import_to_database:
        name: <white><bold> 匯入資料庫
        description: |-
          <gray> 從附加元件
          <gray> 資料夾中的檔案
          <gray> 匯入資料庫。
      wipe_islands_data:
        name: <white><bold> 清除島嶼資料
        description: |-
          <gray> 清除此遊戲模式
          <gray> 的所有島嶼
          <gray> 生態域資料。
      wipe_biomes_data:
        name: <white><bold> 清除生態域資料
        description: |-
          <gray> 清除此遊戲模式
          <gray> 的所有生態域
          <gray> 與套件資料。
      add_biome:
        name: <white><bold> 新增生態域
        description: |-
          <gray> 建立新的生態域，
          <gray> 讓玩家能透過
          <gray> 選單使用。
      remove_biome:
        name: <white><bold> 移除生態域
        description: |-
          <gray> 從玩家選單中
          <gray> 移除所選的
          <gray> 生態域。
        title: '<yellow>已選擇的生態域：'
        value: <yellow> - [biome]
      accept_selected:
        name: <white><bold> 確認選擇
        description: <gray> 確認目前選擇的項目。
        title: '<yellow>已選擇的項目：'
        element: <yellow> - [element]
      environment_element:
        name: <white><bold>[environment]
        description: <gray>[description]。
      properties:
        name: <white><bold> 屬性
        description: <gray> 檢視生態域主要屬性。
      change_properties:
        name: <white><bold> 變更屬性
        description: <gray> 檢視可修改的生態域屬性。
      unlock_properties:
        name: <white><bold> 解鎖條件
        description: <gray> 檢視生態域的解鎖條件。
      biome:
        name: <white><bold>[biome]
        description: <gray>Minecraft 生態域類型。
        value: '<gray>生態域 ID：<yellow>[id]'
      name:
        name: <white><bold> 顯示名稱
        description: |-
          <gray> 生態域的顯示名稱。
          <gray> 支援色彩代碼。
        value: '<gray>目前的值：<reset>[name]'
      deployed:
        name: <white><bold> 已部署
        description: |-
          <gray> 切換此生態域是否
          <gray> 開放給玩家使用。
        enabled: <dark_green> 已啟用
        disabled: <red> 已停用
      environment:
        name: <white><bold> 維度
        description: |-
          <gray> 限制此生態域
          <gray> 可套用的維度。
        enabled: <dark_green>
        disabled: <red>
      icon:
        name: <white><bold> 圖示
        description: |-
          <gray> 變更此生態域的
          <gray> 圖示。
      order:
        name: <white><bold> 排序
        description: |-
          <gray> 調整物件的
          <gray> 排序順序。
          <gray> 若數值相同，
          <gray> 將依唯一 ID
          <gray> 排序。
        value: '<gray>目前排序：<yellow>[number]'
      description:
        name: <white><bold> 描述
        description: |-
          <gray> 生態域的詳細描述。
          <gray> 支援色彩代碼。
        value: '<yellow>目前描述：'
        none: <gray>尚未設定描述。
      unlock_permissions:
        name: <white><bold> 解鎖權限
        description: |-
          <gray> 設定解鎖此
          <gray> 生態域所需的
          <gray> 權限。
        title: '<yellow>權限：'
        element: ' <dark_gray>- [permission]'
        none: <gray>尚未設定權限。
      unlock_cost:
        name: <white><bold> 解鎖花費
        description: |-
          <gray> 設定解鎖此
          <gray> 生態域所需花費。
        value: '<gray>目前花費：<yellow>[number]'
      unlock_items:
        name: <white><bold> 解鎖物品
        description: |-
          <gray> 設定解鎖此
          <gray> 生態域所需物品。
        title: '<yellow>物品：'
        element: ' <dark_gray>- [number]×[item]'
        none: <gray>尚未設定物品。
      unlock_level:
        name: <white><bold> 解鎖等級
        description: |-
          <gray> 設定解鎖此
          <gray> 生態域所需的
          <gray> 島嶼等級。
        value: '<gray>目前等級：<yellow>[number]'
      change_cost:
        name: <white><bold> 套用花費
        description: |-
          <gray> 設定套用此
          <gray> 生態域所需花費。
        value: '<gray>目前花費：<yellow>[number]'
      change_items:
        name: <white><bold> 套用物品
        description: |-
          <gray> 設定套用此
          <gray> 生態域所需物品。
        title: '<yellow>物品：'
        element: ' <dark_gray>- [number]×[item]'
        none: <gray>尚未設定物品。
      change_type:
        name: <white><bold>[type]
        description: |-
          <gray> 設定套用生態域
          <gray> 的花費計算方式。
        static:
          name: 固定值
          description: |-
            <gray> 套用生態域的
            <gray> 花費固定不變。
        per_block:
          name: 每方塊
          description: |-
            <gray> 花費將依照
            <gray> 變更的方塊數量計算。
        per_usage:
          name: 每次使用
          description: |-
            <gray> 每次套用後，
            <gray> 花費都會
            <gray> 增加。
        enabled: <dark_green> 已啟用
        disabled: <red> 已停用
      change_increment:
        name: <white><bold> 遞增值
        description: |-
          <gray> 設定每次使用後
          <gray> 增加的數值。
        value: '<gray>目前數值：<yellow>[number]'
      biome-filter:
        name: <white><bold>[filter]
        description: |-
          <gray> 依據 Minecraft Wiki
          <gray> 的生態域分類。
        lush: 繁茂生態域
        dry: 乾燥生態域
        cold: 寒冷生態域
        snowy: 雪地生態域
        aquatic: 海洋生態域
        nether: 地獄生態域
        the_end: 終界生態域
        neutral: 中性生態域
        unused: 未使用生態域
        warm: 溫暖生態域
        cave: 洞穴生態域
        temperate: 溫帶生態域
      protection_range:
        name: <white><bold> 保護範圍
        description: |-
          <gray> 限制生態域變更
          <gray> 僅套用於島嶼
          <gray> 保護範圍內，
          <gray> 而非整座島嶼。
        enabled: <dark_green> 已啟用
        disabled: <red> 已停用
      reset:
        name: <white><bold> 島主變更時重設
        description: |-
          <gray> 若島嶼更換島主，
          <gray> 且新島主沒有目前
          <gray> 生態域的使用權限，
          <gray> 則自動恢復為
          <gray> 預設生態域。
        enabled: <dark_green> 已啟用
        disabled: <red> 已停用
      cool_down:
        name: <white><bold> 生態域冷卻時間
        description: |-
          <gray> 設定玩家再次
          <gray> 變更生態域前
          <gray> 必須等待的秒數。
        value: '<gray>目前冷卻時間：<yellow>[number]'
        disabled: <yellow>已停用冷卻時間。
      default_size:
        name: <white><bold> 預設範圍
        description: |-
          <gray> 玩家未指定範圍時，
          <gray> 將使用此預設值。
        value: '<gray>預設範圍：<yellow>[number]'
      default_mode:
        name: <white><bold> 預設更新模式
        description: |-
          <gray> 玩家未指定更新模式時，
          <gray> 將使用此預設值。
        enabled: <dark_green>
        disabled: <red>
      unlock_notify:
        name: <white><bold> 解鎖通知
        description: |-
          <gray> 玩家解鎖新的
          <gray> 生態域時，
          <gray> 將收到通知。
        enabled: <aqua>解鎖通知已<green>啟用<aqua>。
        disabled: <aqua>解鎖通知已<red>停用<aqua>。
      change_timeout:
        name: <white><bold> 更新逾時時間
        description: |-
          <gray> 設定生態域更新
          <gray> 超過多少分鐘後
          <gray> 自動終止。
          <gray> 大型島嶼或
          <gray> 伺服器負載過高時
          <gray> 可能會發生。
        value: '<gray>逾時時間：<yellow>[number] 分鐘'
      parallel_updates:
        name: <white><bold> 平行更新
        description: |-
          <gray> 設定可同時進行
          <gray> 的生態域更新數量。
          <gray> 其餘更新將會
          <gray> 進入等待佇列。
        value: '<gray>目前數值：<yellow>[number]<gray>。'
      use_bank:
        name: <white><bold> 使用銀行帳戶
        description: |-
          <gray> 設定 Biomes
          <gray> 附加元件的所有付款
          <gray> 是否使用 Bank
          <gray> 附加元件的島嶼銀行帳戶。
        enabled: <aqua>已<green>啟用<aqua>使用銀行帳戶。
        disabled: <aqua>已<red>停用<aqua>使用銀行帳戶。
        missing: <red>尚未安裝 Bank 附加元件。
      visibility:
        name: <white><bold> 生態域顯示
        description: |-
          <gray> 設定玩家在
          <gray> 生態域選擇介面中
          <gray> 可看到的生態域。
        enabled: <dark_green>
        disabled: <red>
        all: 所有生態域
        deployed: 已部署的生態域
        accessible: 可使用的生態域
        toggleable: 可切換
      is_online:
        name: <white><bold> 線上玩家島嶼
        description: |-
          <gray> 顯示至少有
          <gray> 一位成員在線上的
          <gray> 所有島嶼。
      all_islands:
        name: <white><bold> 所有島嶼
        description: |-
          <gray> 顯示目前遊戲模式
          <gray> 中建立的
          <gray> 所有島嶼。
      island_name:
        name: <white><bold> [name]
        island-owner: '[player]'
        unknown: <red>未知島主
        description: |-
          [owner]
          [members]
          [id]
        owner: '<gray>島主：<yellow>[player]'
        title: '<gray>島嶼成員：'
        element: ' <gray>- <yellow>[player]'
      change_biome:
        name: <white><bold> 變更生態域
        description: <gray>變更此島嶼的生態域。
      manage_data:
        name: <white><bold> 管理島嶼資料
        description: |-
          <gray> 管理此島嶼
          <gray> 儲存的資料。
      clear_data:
        name: <white><bold> 清除島嶼資料
        description: |-
          <gray> 清除此島嶼
          <gray> 的所有資料。
      island_bundle:
        name: <white><bold> 島嶼套件
        description: |-
          <gray> 指派給目前島嶼的
          <gray> 生態域套件。
          <gray> 島嶼只能使用
          <gray> 此套件中的
          <gray> 生態域。
        value: '<aqua>套件：[bundle]'
        overwritten: |-
          <red>島主擁有可覆寫
          <red>套件設定的權限。
      owner_bundle:
        name: <white><bold> 島主套件
        description: |-
          <gray> 指派給目前島主的
          <gray> 生態域套件。
          <gray> 島嶼只能使用
          <gray> 此套件中的
          <gray> 生態域。
          <gray> 指派權限：
          <gray><italic>'[gamemode].biomes.bundle.<bundle-id>'
        value: '<aqua>套件：[bundle]'
      reset_to_default:
        name: <white><bold> 重設為預設值
        description: |-
          <gray> 將所有島嶼設定
          <gray> 重設為設定檔中的
          <gray> 預設值。
      bundle_info:
        name: <white><bold> 基本資訊
        description: |-
          <gray> 檢視套件的
          <gray> 基本資訊。
      bundle_biomes:
        name: <white><bold> 管理生態域
        description: |-
          <gray> 管理此套件
          <gray> 包含的生態域。
      bundle_name:
        name: <white><bold> 變更名稱
        description: |-
          <gray> 變更套件的
          <gray> 顯示名稱。
        value: '<yellow>目前的值：<reset>[bundle]'
      bundle_icon:
        name: <white><bold> 變更圖示
        description: <gray>變更套件圖示。
      bundle_description:
        name: <white><bold> 變更描述
        description: <gray>變更套件描述。
        value: '<yellow>目前的值：'
        none: <red>尚未設定描述。
      bundle_permission:
        name: <white><bold> 套件權限
        description: |-
          <gray> 將此權限給予玩家後，
          <gray> 即可強制使用
          <gray> 此套件。
        value: '<yellow>權限：<white>[gamemode].biomes.bundle.[id]'
      add_bundle_biome:
        name: <white><bold> 新增生態域
        description: |-
          <gray> 將生態域加入
          <gray> 此套件。
        title: '<aqua>已選擇的生態域：'
        value: <aqua>- [biome]
      remove_bundle_biome:
        name: <white><bold> 移除生態域
        description: |-
          <gray> 將生態域從
          <gray> 此套件中移除。
        title: '<aqua>已選擇的生態域：'
        value: <aqua>- [biome]
      create_bundle:
        name: <white><bold> 建立套件
        description: |-
          <gray> 為目前遊戲模式
          <gray> 建立新的套件。
      delete_bundle:
        name: <white><bold> 移除套件
        description: |-
          <gray> 從目前遊戲模式
          <gray> 完全移除此套件。
        title: '<aqua>已選擇的套件：'
        value: <aqua>- [bundle]
      download:
        name: <white><bold> 下載
        description: <gray>下載線上資料庫。
        enabled: <dark_green>清除快取後下載
        disabled: <red>直接下載（不清除快取）
    tips:
      click-to-filter: <yellow> 點擊 <gray> 即可篩選。
      click-to-manage: <yellow> 點擊 <gray> 即可管理。
      click-to-clear: <yellow> 點擊 <gray> 即可清除。
      click-to-change-biome: <yellow> 點擊 <gray> 即可變更生態域。
      click-to-view: <yellow> 點擊 <gray> 即可檢視。
      click-to-select: <yellow> 點擊 <gray> 即可選擇。
      click-to-choose: <yellow> 點擊 <gray> 即可選取。
      click-to-complete: <yellow> 點擊 <gray> 即可完成。
      left-click-to-accept: <yellow> 左鍵 <gray> 即可套用。
      right-click-to-write: <yellow> 右鍵 <gray> 即可輸入。
      click-to-reduce: <yellow> 點擊 <gray> 即可減少。
      click-to-increase: <yellow> 點擊 <gray> 即可增加。
      click-to-return: <yellow> 點擊 <gray> 即可返回。
